<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Monitor — Kompetitor TikTok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171310;
    --bg-panel: #201a15;
    --bg-panel-live: #2b1d10;
    --line: #362d24;
    --line-live: #5c3a14;
    --text: #f3ece1;
    --text-dim: #96897a;
    --live: #ff7a1a;
    --live-soft: rgba(255, 122, 26, 0.16);
    --cool: #4fd1c5;
    --gold: #ffc857;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(255,122,26,0.05), transparent),
      var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }

  /* ---------- Topbar ---------- */

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 40px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
    gap: 20px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand .airbox {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--bg);
    background: var(--live);
    padding: 4px 8px 3px;
    border-radius: 3px;
    line-height: 1;
  }

  .brand h1 {
    font-family: 'Big Shoulders Display', sans-serif;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 0.01em;
    line-height: 1;
  }

  .brand .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 3px;
    display: block;
  }

  .brand-text { display: flex; flex-direction: column; }

  .stat-row {
    display: flex;
    align-items: center;
    gap: 30px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat .num {
    font-family: 'Big Shoulders Display', sans-serif;
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
  }

  .stat.on-air .num { color: var(--live); display: flex; align-items: baseline; gap: 8px; }

  .stat .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* animated equalizer bars next to the live count -- signature element */
  .eq {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 16px;
  }
  .eq span {
    width: 3px;
    background: var(--live);
    border-radius: 1px;
    animation: eq-bounce 0.9s ease-in-out infinite;
  }
  .eq span:nth-child(1) { height: 40%; animation-delay: -0.6s; }
  .eq span:nth-child(2) { height: 100%; animation-delay: -0.3s; }
  .eq span:nth-child(3) { height: 65%; animation-delay: -0.9s; }
  .eq span:nth-child(4) { height: 85%; animation-delay: -0.15s; }
  @keyframes eq-bounce {
    0%, 100% { transform: scaleY(0.35); }
    50% { transform: scaleY(1); }
  }
  .eq.paused span { animation-play-state: paused; transform: scaleY(0.2); }

  button#refresh {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 10px 16px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: border-color 0.15s, background 0.15s;
  }
  button#refresh:hover { border-color: var(--live); background: var(--live-soft); }
  button#refresh:disabled { opacity: 0.5; cursor: default; }

  /* ---------- Main / filters ---------- */

  main { padding: 24px 40px 60px; }

  .view-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }

  .view-tab {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    font-size: 16px;
    padding: 10px 4px;
    margin-right: 24px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }

  .view-tab:hover { color: var(--text); }

  .view-tab.active {
    color: var(--live);
    border-color: var(--live);
  }

  .filter-row {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: all 0.15s;
  }

  .filter-btn:hover { border-color: var(--live); color: var(--text); }

  .filter-btn.active {
    background: var(--live);
    border-color: var(--live);
    color: var(--bg);
    font-weight: 600;
  }

  .search-box {
    position: relative;
    margin-left: auto;
  }

  .search-box input {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 8px 12px 8px 30px;
    border-radius: 20px;
    width: 200px;
    transition: border-color 0.15s, width 0.2s;
  }

  .search-box input:focus {
    outline: none;
    border-color: var(--live);
    width: 240px;
  }

  .search-box input::placeholder { color: var(--text-dim); }

  .search-box svg {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    width: 13px;
    height: 13px;
    stroke: var(--text-dim);
    pointer-events: none;
  }

  @media (max-width: 600px) {
    .search-box { margin-left: 0; width: 100%; }
    .search-box input { width: 100%; }
    .search-box input:focus { width: 100%; }
  }

  /* ---------- Grid & cards ---------- */

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 18px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.15s;
  }

  .card.live {
    background: var(--bg-panel-live);
    border-color: var(--line-live);
    box-shadow: 0 0 0 1px rgba(255,122,26,0.1), 0 10px 28px -14px rgba(255,122,26,0.45);
  }

  .card.live::before {
    content: "ON AIR";
    position: absolute;
    top: 0; right: 0;
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 800;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--bg);
    background: var(--live);
    padding: 3px 8px 2px;
    border-radius: 0 6px 0 6px;
  }

  .card-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #2a231c;
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    color: var(--text-dim);
    border: 2px solid var(--line);
  }

  .card.live .avatar { border-color: var(--live); }

  .who { min-width: 0; }

  .username {
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .status-line {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 3px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4a4136;
    flex-shrink: 0;
  }

  .card.live .dot {
    background: var(--live);
    animation: pulse 1.4s ease-in-out infinite;
  }

  .card.live .status-line { color: var(--live); font-weight: 500; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,122,26,0.55); }
    50% { box-shadow: 0 0 0 5px rgba(255,122,26,0); }
  }

  .title-text {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 18px;
  }

  .stale-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--gold);
    background: rgba(255, 200, 87, 0.1);
    border: 1px solid rgba(255, 200, 87, 0.3);
    padding: 4px 8px;
    border-radius: 3px;
    margin-bottom: 10px;
    cursor: help;
  }

  .card-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }

  .viewers {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--gold);
    font-weight: 600;
  }

  .viewers .label { color: var(--text-dim); font-weight: 400; margin-left: 4px; }

  a.open-link {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-decoration: none;
    letter-spacing: 0.03em;
    border-bottom: 1px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  a.open-link:hover { color: var(--live); border-color: var(--live); }

  .empty {
    text-align: center;
    padding: 100px 20px;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }

  .footer-note {
    margin-top: 40px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
  }

  /* ---------- Leaderboard table ---------- */

  .lb-table {
    width: 100%;
    border-collapse: collapse;
  }

  .lb-table thead th {
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }

  .lb-table thead th.num-col { text-align: right; }

  .lb-table tbody tr {
    border-bottom: 1px solid var(--line);
    transition: background 0.15s;
  }

  .lb-table tbody tr:hover { background: var(--bg-panel); }

  .lb-table td {
    padding: 12px;
    font-size: 13px;
    vertical-align: middle;
  }

  .lb-table td.num-col {
    text-align: right;
    font-family: 'IBM Plex Mono', monospace;
  }

  .lb-rank {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--text-dim);
    width: 30px;
  }

  .lb-rank.top1 { color: var(--gold); }
  .lb-rank.top2 { color: var(--text); }
  .lb-rank.top3 { color: var(--live); }

  .lb-account {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .lb-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #2a231c;
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    border: 1px solid var(--line);
  }

  .lb-region-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .lb-sessions {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--live);
    font-weight: 600;
  }

  .lb-viewers { color: var(--gold); }

  @media (max-width: 600px) {
    .topbar { padding: 20px; }
    main { padding: 20px 20px 40px; }
    .stat-row { gap: 18px; }
    .brand h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="airbox">● REC</span>
    <div class="brand-text">
      <h1>Live Monitor</h1>
      <span class="tag">Kompetitor · TikTok</span>
    </div>
  </div>
  <div class="stat-row">
    <div class="stat on-air">
      <span class="num"><span id="stat-live">–</span><span class="eq" id="eq"><span></span><span></span><span></span><span></span></span></span>
      <span class="label">Sedang Live</span>
    </div>
    <div class="stat">
      <span class="num" id="stat-total">–</span>
      <span class="label">Dipantau</span>
    </div>
    <div class="stat">
      <span class="num" id="stat-updated">–</span>
      <span class="label">Update Terakhir</span>
    </div>
    <button id="refresh">↻ Refresh</button>
  </div>
</div>

<main>
  <div class="view-tabs">
    <button class="view-tab active" data-view="live">Live Sekarang</button>
    <button class="view-tab" data-view="leaderboard">Leaderboard</button>
  </div>

  <div id="view-live">
    <div class="filter-row">
      <button class="filter-btn active" data-region="all">Semua</button>
      <button class="filter-btn" data-region="jogja">Jogja</button>
      <button class="filter-btn" data-region="luar_jogja">Luar Jogja</button>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Cari akun…" autocomplete="off">
      </div>
    </div>
    <div class="grid" id="grid">
      <div class="empty">Memuat data akun…</div>
    </div>
    <div class="footer-note">Auto-refresh tiap 30 detik · Data diambil dari status live TikTok tiap akun</div>
  </div>

  <div id="view-leaderboard" style="display:none;">
    <div class="filter-row">
      <button class="filter-btn active" data-days="7">7 Hari</button>
      <button class="filter-btn" data-days="30">30 Hari</button>
      <button class="filter-btn active" data-lb-region="all" style="margin-left:auto;">Semua</button>
      <button class="filter-btn" data-lb-region="jogja">Jogja</button>
      <button class="filter-btn" data-lb-region="luar_jogja">Luar Jogja</button>
    </div>
    <div id="leaderboard-wrap">
      <div class="empty">Memuat leaderboard…</div>
    </div>
    <div class="footer-note">Ranking berdasarkan jumlah sesi live & rata-rata penonton</div>
  </div>
</main>

<script>
  // Ganti dengan URL backend Railway kamu, misal:
  // const API_BASE = "https://tiktok-live-monitor-production.up.railway.app";
  const API_BASE = "https://report-marketing-production.up.railway.app";

  const grid = document.getElementById('grid');
  const statLive = document.getElementById('stat-live');
  const statTotal = document.getElementById('stat-total');
  const statUpdated = document.getElementById('stat-updated');
  const refreshBtn = document.getElementById('refresh');
  const filterButtons = document.querySelectorAll('#view-live .filter-btn');
  const searchInput = document.getElementById('search-input');
  const eq = document.getElementById('eq');

  let allAccounts = [];       // data mentah terakhir dari backend
  let currentRegion = 'all';  // filter aktif: all | jogja | luar_jogja
  let currentSearch = '';     // teks pencarian aktif (lowercase)

  function initials(name) {
    return name.slice(0, 2).toUpperCase();
  }

  function timeAgo(isoString) {
    if (!isoString) return '–';
    const diffMs = Date.now() - new Date(isoString).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'baru saja';
    if (mins < 60) return `${mins} menit lalu`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs} jam lalu`;
    return `${Math.floor(hrs / 24)} hari lalu`;
  }

  function formatViewers(n) {
    if (n === null || n === undefined) return null;
    if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'rb';
    return String(n);
  }

  function renderCard(acc) {
    const isLive = !!acc.is_live;
    const avatarStyle = acc.avatar_url ? `style="background-image:url('${acc.avatar_url}')"` : '';
    const avatarContent = acc.avatar_url ? '' : initials(acc.username);
    const viewers = formatViewers(acc.viewer_count);

    // Deteksi "data usang": kalau percobaan terakhir (last_attempt) lebih
    // dari 5 menit setelah pengecekan terakhir yang BERHASIL (last_checked),
    // berarti sistem sedang gagal berulang untuk akun ini -- status yang
    // ditampilkan mungkin sudah tidak akurat.
    let isStale = false;
    if (acc.last_attempt && acc.last_checked) {
      const gapMs = new Date(acc.last_attempt) - new Date(acc.last_checked);
      isStale = gapMs > 5 * 60 * 1000;
    } else if (acc.last_attempt && !acc.last_checked) {
      isStale = true; // belum pernah berhasil dicek sama sekali
    }

    return `
      <div class="card ${isLive ? 'live' : ''}">
        <div class="card-top">
          <div class="avatar" ${avatarStyle}>${avatarContent}</div>
          <div class="who">
            <div class="username">@${acc.username}</div>
            <div class="status-line">
              <span class="dot"></span>
              ${isLive ? 'LIVE SEKARANG' : 'Offline · terakhir dicek ' + timeAgo(acc.last_checked)}
            </div>
          </div>
        </div>
        ${isStale ? `<div class="stale-badge" title="${acc.last_error || 'Gagal dicek berulang kali'}">⚠ Data mungkin usang · gagal dicek ${timeAgo(acc.last_attempt)}</div>` : ''}
        ${isLive ? `<div class="title-text">${acc.title || 'Tanpa judul'}</div>` : `<div class="title-text"></div>`}
        <div class="card-bottom">
          <div class="viewers">
            ${isLive && viewers ? viewers + '<span class="label">penonton</span>' : ''}
          </div>
          <a class="open-link" href="https://www.tiktok.com/@${acc.username}/live" target="_blank" rel="noopener">Buka →</a>
        </div>
      </div>
    `;
  }

  function applyFilterAndRender() {
    let filtered = currentRegion === 'all'
      ? allAccounts
      : allAccounts.filter(a => a.region === currentRegion);

    if (currentSearch) {
      filtered = filtered.filter(a => a.username.toLowerCase().includes(currentSearch));
    }

    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty">Tidak ada akun yang cocok.</div>';
    } else {
      grid.innerHTML = filtered.map(renderCard).join('');
    }

    const liveCount = filtered.filter(a => a.is_live).length;
    statLive.textContent = liveCount;
    statTotal.textContent = filtered.length;
  }

  async function loadStatus() {
    refreshBtn.disabled = true;
    refreshBtn.textContent = '↻ Memuat…';
    try {
      const res = await fetch(`${API_BASE}/api/status`);
      const data = await res.json();
      allAccounts = data.accounts || [];

      if (allAccounts.length === 0) {
        grid.innerHTML = '<div class="empty">Belum ada data. Menunggu pengecekan pertama…</div>';
        statLive.textContent = 0;
        statTotal.textContent = 0;
      } else {
        applyFilterAndRender();
      }

      statUpdated.textContent = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    } catch (err) {
      grid.innerHTML = `<div class="empty">Gagal memuat data. Pastikan backend aktif di ${API_BASE}.<br><br>(${err.message})</div>`;
    } finally {
      refreshBtn.disabled = false;
      refreshBtn.textContent = '↻ Refresh';
    }
  }

  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      filterButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRegion = btn.dataset.region;
      applyFilterAndRender();
    });
  });

  searchInput.addEventListener('input', () => {
    currentSearch = searchInput.value.trim().toLowerCase();
    applyFilterAndRender();
  });

  refreshBtn.addEventListener('click', loadStatus);
  loadStatus();
  setInterval(loadStatus, 30000);

  // ================== VIEW TABS (Live / Leaderboard) ==================

  const viewTabs = document.querySelectorAll('.view-tab');
  const viewLive = document.getElementById('view-live');
  const viewLeaderboard = document.getElementById('view-leaderboard');

  viewTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      viewTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const view = tab.dataset.view;
      viewLive.style.display = view === 'live' ? '' : 'none';
      viewLeaderboard.style.display = view === 'leaderboard' ? '' : 'none';
      if (view === 'leaderboard') loadLeaderboard();
    });
  });

  // ================== LEADERBOARD ==================

  const leaderboardWrap = document.getElementById('leaderboard-wrap');
  const dayButtons = document.querySelectorAll('#view-leaderboard [data-days]');
  const lbRegionButtons = document.querySelectorAll('#view-leaderboard [data-lb-region]');

  let currentDays = 7;
  let currentLbRegion = 'all';

  function renderLeaderboardRow(entry, rank) {
    const avatarStyle = entry.avatar_url ? `style="background-image:url('${entry.avatar_url}')"` : '';
    const avatarContent = entry.avatar_url ? '' : initials(entry.username);
    const rankClass = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : '';
    const regionLabel = entry.region === 'jogja' ? 'Jogja' : 'Luar Jogja';
    const avgViewers = entry.avg_viewers !== null ? entry.avg_viewers : '–';
    const maxViewers = entry.max_viewers !== null ? entry.max_viewers : '–';

    return `
      <tr>
        <td class="lb-rank ${rankClass}">${rank}</td>
        <td>
          <div class="lb-account">
            <div class="lb-avatar" ${avatarStyle}>${avatarContent}</div>
            <div>
              <div class="username">@${entry.username}</div>
              <div class="lb-region-tag">${regionLabel}</div>
            </div>
          </div>
        </td>
        <td class="num-col lb-sessions">${entry.session_count}×</td>
        <td class="num-col lb-viewers">${avgViewers}</td>
        <td class="num-col lb-viewers">${maxViewers}</td>
        <td class="num-col" style="color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:11px;">${timeAgo(entry.last_live_at)}</td>
      </tr>
    `;
  }

  async function loadLeaderboard() {
    leaderboardWrap.innerHTML = '<div class="empty">Memuat leaderboard…</div>';
    try {
      const res = await fetch(`${API_BASE}/api/leaderboard?days=${currentDays}&region=${currentLbRegion}`);
      const data = await res.json();
      const entries = data.leaderboard || [];

      if (entries.length === 0) {
        leaderboardWrap.innerHTML = '<div class="empty">Belum ada data live tercatat untuk rentang ini.</div>';
        return;
      }

      leaderboardWrap.innerHTML = `
        <table class="lb-table">
          <thead>
            <tr>
              <th></th>
              <th>Akun</th>
              <th class="num-col">Sesi Live</th>
              <th class="num-col">Rata² Penonton</th>
              <th class="num-col">Penonton Tertinggi</th>
              <th class="num-col">Terakhir Live</th>
            </tr>
          </thead>
          <tbody>
            ${entries.map((e, i) => renderLeaderboardRow(e, i + 1)).join('')}
          </tbody>
        </table>
      `;
    } catch (err) {
      leaderboardWrap.innerHTML = `<div class="empty">Gagal memuat leaderboard. (${err.message})</div>`;
    }
  }

  dayButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      dayButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentDays = parseInt(btn.dataset.days, 10);
      loadLeaderboard();
    });
  });

  lbRegionButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      lbRegionButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentLbRegion = btn.dataset.lbRegion;
      loadLeaderboard();
    });
  });
</script>

</body>
</html>
